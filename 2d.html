            // ============================================================================
            // 5.4 FOREGROUND POND (PUKUR), REFLECTIONS, SHAPLA, WATER HYACINTH & RIPPLES
            // ============================================================================
            function drawPondAndWater(wctx, state) {
                const { t, pal, wind, rain, lantern } = state;

                const pondGrad = wctx.createLinearGradient(800, 625, 800, 900);
                pondGrad.addColorStop(0, `rgb(${pal.waterTop.map(Math.round).join(',')})`);
                pondGrad.addColorStop(0.55, `rgb(${pal.waterBot.map(Math.round).join(',')})`);
                pondGrad.addColorStop(1, '#0e1918');

                wctx.save();
                wctx.beginPath();
                wctx.moveTo(350, 900);
                wctx.bezierCurveTo(375, 650, 495, 622, 695, 636);
                wctx.lineTo(845, 640);
                wctx.bezierCurveTo(1080, 628, 1360, 650, 1600, 672);
                wctx.lineTo(1600, 900);
                wctx.closePath();
                wctx.fillStyle = pondGrad;
                wctx.fill();
                wctx.clip();

                for (let y = 645; y < 865; y += 7) {
                    const wave = Math.sin(y * 0.18 - t * (2.2 + wind * 4)) * (4 + wind * 9);
                    wctx.fillStyle = 'rgba(42, 58, 52, 0.25)';
                    wctx.fillRect(960 + wave, y, 340, 4);
                    if (lantern > 0.02) {
                        wctx.fillStyle = `rgba(255, 184, 77, ${lantern * 0.28 * (1 - (y - 645) / 220)})`;
                        wctx.fillRect(1115 + wave * 1.4, y, 42 - (y - 645) * 0.12, 4);
                    }
                }

                wctx.strokeStyle = lerpRgba(pal.skyHor, [255, 255, 255], 0.35, 0.22 + rain * 0.28);
                wctx.lineWidth = 1.1;
                for (const rp of ripples) {
                    const activeRatio = rain > 0.05 ? 1.0 : 0.35;
                    if (rp.x % 1 > activeRatio) continue;
                    wctx.beginPath();
                    wctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.32, 0, 0, Math.PI * 2);
                    wctx.stroke();
                }

                for (const hc of hyacinthClusters) {
                    const drift = Math.sin(t * 0.8 + hc.x) * (3 + wind * 6);
                    for (let i = 0; i < hc.count; i++) {
                        const hx = hc.x + (i - hc.count * 0.5) * 14 + drift;
                        const hy = hc.y + Math.sin(i * 1.9) * 9;
                        wctx.fillStyle = '#3f6e33';
                        wctx.beginPath();
                        wctx.ellipse(hx, hy, 9, 5, 0.2, 0, Math.PI * 2);
                        wctx.fill();
                        if (i % 3 === 0) {
                            wctx.fillStyle = '#9b72cf';
                            wctx.beginPath();
                            wctx.ellipse(hx, hy - 6, 3, 5, 0, 0, Math.PI * 2);
                            wctx.fill();
                        }
                    }
                }

                for (const sh of shaplas) {
                    const bob = Math.sin(t * 1.6 + sh.x * 0.05) * 2.2;
                    const sx = sh.x + bob;
                    const sy = sh.y + bob * 0.4;
                    wctx.fillStyle = '#2e5930';
                    wctx.beginPath();
                    wctx.ellipse(sx - 6, sy + 3, 15 * sh.size, 6 * sh.size, 0, 0.2, Math.PI * 1.9);
                    wctx.lineTo(sx - 6, sy + 3);
                    wctx.closePath();
                    wctx.fill();
                    wctx.fillStyle = sh.pink ? '#e85d88' : '#f7f4ea';
                    for (let p = -2; p <= 2; p++) {
                        wctx.beginPath();
                        wctx.ellipse(sx + p * 3 * sh.size, sy - 3 * sh.size, 2.6 * sh.size, 6.5 * sh.size, p * 0.25, 0, Math.PI * 2);
                        wctx.fill();
                    }
                    wctx.fillStyle = '#f4d03f';
                    wctx.beginPath();
                    wctx.arc(sx, sy - 2, 2.2 * sh.size, 0, Math.PI * 2);
                    wctx.fill();
                }

                wctx.restore();

                const bankGrad = wctx.createLinearGradient(0, 575, 520, 900);
                bankGrad.addColorStop(0, '#4a6b34');
                bankGrad.addColorStop(0.5, '#355224');
                bankGrad.addColorStop(1, '#1d2e14');
                wctx.fillStyle = bankGrad;
                wctx.beginPath();
                wctx.moveTo(0, 572);
                wctx.bezierCurveTo(250, 565, 515, 580, 655, 642);
                wctx.bezierCurveTo(505, 695, 445, 795, 425, 900);
                wctx.lineTo(0, 900);
                wctx.closePath();
                wctx.fill();

                // Bamboo Fishing Pole for Kingfisher over Pond Edge
                const poleSway = sampleWind(535, 620, t, wind) * 6;
                wctx.strokeStyle = '#6e5534';
                wctx.lineWidth = 2.5;
                wctx.beginPath();
                wctx.moveTo(505, 655);
                wctx.quadraticCurveTo(545, 615, 582 + poleSway, 602);
                wctx.stroke();

                // Foreground Swaying Grass & Heart-shaped Taro/Arum Leaves (Kochu Pata) on lower-left bank
                wctx.save();
                for (let gx = 12; gx < 475; gx += 14) {
                    const gy = 635 + (gx % 5) * 48;
                    const sway = sampleWind(gx, gy, t, wind) * 18;
                    wctx.strokeStyle = gx % 28 === 0 ? '#587d3b' : '#3a5725';
                    wctx.lineWidth = 2;
                    wctx.beginPath();
                    wctx.moveTo(gx, gy + 24);
                    wctx.quadraticCurveTo(gx + sway * 0.5, gy + 8, gx + sway, gy - 10);
                    wctx.stroke();

                    // Broad heart-shaped Kochu Pata (Taro leaves) along the damp pond bank
                    if (gx % 56 === 12) {
                        wctx.save();
                        wctx.translate(gx + sway * 0.7, gy - 4);
                        wctx.rotate(0.2 + sway * 0.015);
                        wctx.fillStyle = '#3d6628';
                        wctx.beginPath();
                        wctx.ellipse(0, 0, 11, 7.5, 0, 0, Math.PI * 2);
                        wctx.fill();
                        wctx.strokeStyle = '#6b9445';
                        wctx.lineWidth = 0.9;
                        wctx.beginPath();
                        wctx.moveTo(-8, 0);
                        wctx.lineTo(9, 0);
                        wctx.stroke();
                        wctx.restore();
                    }
                }
                wctx.restore();
            }

            // ============================================================================
            // 6. STAGE 3: REALISTIC MULTI-JOINTED CHARACTERS, ATTIRE & WILDLIFE
            // ============================================================================

            // High-Detail Multi-Jointed Human Character Renderer
            function drawPerson(wctx, opts) {
                const {
                    x, y, scale = 1.0, dir = 1, walkPhase = 0, isWalking = false,
                    isSitting = false, isRunning = false, breathe = 0, wind = 0,
                    role = 'boy', // 'grandmother' | 'mother' | 'farmer' | 'boy' | 'childGirl' | 'childBoy'
                    armReach = 0,
                    timeSec = 0
                } = opts;

                wctx.save();
                wctx.translate(x, y);
                // Slightly larger, natural 6.5-head human proportions
                const s = scale * 1.18;
                wctx.scale(s * dir, s);

                // Soft contact ground shadow
                wctx.fillStyle = 'rgba(15, 12, 8, 0.28)';
                wctx.beginPath();
                wctx.ellipse(0, 2, isSitting ? 14 : 11, 3.8, 0, 0, Math.PI * 2);
                wctx.fill();

                const skinBase = role === 'farmer' ? '#7a4b2c' : role === 'grandmother' ? '#916344' : '#8c5a3b';
                const skinShadow = role === 'farmer' ? '#5e381f' : '#6e4329';

                const strideAmp = isRunning ? 0.68 : isWalking ? 0.42 : 0;
                const stride = Math.sin(walkPhase) * strideAmp;
                const oppStride = -stride;
                const kneeBendA = isWalking || isRunning ? Math.max(0, Math.cos(walkPhase)) * (isRunning ? 0.65 : 0.35) : 0;
                const kneeBendB = isWalking || isRunning ? Math.max(0, -Math.cos(walkPhase)) * (isRunning ? 0.65 : 0.35) : 0;
                const bob = isWalking || isRunning ? Math.abs(Math.cos(walkPhase)) * (isRunning ? 3.2 : 1.5) : 0;
                const leanForward = isRunning ? 0.14 : isWalking ? 0.04 : 0;

                const hipY = (isSitting ? -6 : -19) - bob;
                const shoulderY = (isSitting ? -24 : -36) - bob + breathe * 0.7;

                wctx.rotate(leanForward);

                // Helper for 2-segment anatomical leg (hip -> knee -> ankle -> foot)
                function drawLeg(hipX, thighAng, kneeFlex, isBack) {
                    const thighLen = 9.5;
                    const calfLen = 9.5;
                    const kx = hipX + Math.sin(thighAng) * thighLen;
                    const ky = hipY + Math.cos(thighAng) * thighLen;
                    const totalCalfAng = thighAng - kneeFlex;
                    const ax = kx + Math.sin(totalCalfAng) * calfLen;
                    const ay = ky + Math.cos(totalCalfAng) * calfLen;

                    wctx.strokeStyle = isBack ? skinShadow : skinBase;
                    wctx.lineWidth = 3.6;
                    wctx.lineCap = 'round';
                    wctx.lineJoin = 'round';
                    wctx.beginPath();
                    wctx.moveTo(hipX, hipY);
                    wctx.lineTo(kx, ky);
                    wctx.lineTo(ax, ay);
                    wctx.stroke();

                    // Anatomical foot
                    wctx.fillStyle = isBack ? skinShadow : skinBase;
                    wctx.beginPath();
                    wctx.ellipse(ax + 2.2, ay + 0.5, 4.2, 1.8, -totalCalfAng * 0.3, 0, Math.PI * 2);
                    wctx.fill();
                }

                // Helper for 2-segment anatomical arm (shoulder -> elbow -> wrist -> hand)
                function drawArm(shX, shY, upperAng, elbowFlex, isBack, sleeveCol) {
                    const upperLen = 8.0;
                    const foreLen = 7.8;
                    const ex = shX + Math.sin(upperAng) * upperLen;
                    const ey = shY + Math.cos(upperAng) * upperLen;
                    const foreAng = upperAng + elbowFlex;
                    const wx = ex + Math.sin(foreAng) * foreLen;
                    const wy = ey + Math.cos(foreAng) * foreLen;

                    // Upper sleeve
                    if (sleeveCol) {
                        wctx.strokeStyle = sleeveCol;
                        wctx.lineWidth = 4.2;
                        wctx.beginPath();
                        wctx.moveTo(shX, shY);
                        wctx.lineTo(lerp(shX, ex, 0.75), lerp(shY, ey, 0.75));
                        wctx.stroke();
                    }

                    // Bare arm & forearm
                    wctx.strokeStyle = isBack ? skinShadow : skinBase;
                    wctx.lineWidth = 3.0;
                    wctx.lineCap = 'round';
                    wctx.lineJoin = 'round';
                    wctx.beginPath();
                    wctx.moveTo(sleeveCol ? lerp(shX, ex, 0.65) : shX, sleeveCol ? lerp(shY, ey, 0.65) : shY);
                    wctx.lineTo(ex, ey);
                    wctx.lineTo(wx, wy);
                    wctx.stroke();

                    // Glass bangles (Churi) on mother's wrist
                    if (role === 'mother' && !isBack) {
                        wctx.strokeStyle = '#e74c3c';
                        wctx.lineWidth = 1.6;
                        wctx.beginPath();
                        wctx.moveTo(wx - 1.5, wy - 1);
                        wctx.lineTo(wx + 1.5, wy - 1);
                        wctx.stroke();
                    }

                    // Hand palm & fingers
                    wctx.fillStyle = isBack ? skinShadow : skinBase;
                    wctx.beginPath();
                    wctx.ellipse(wx + Math.sin(foreAng) * 1.5, wy + Math.cos(foreAng) * 1.5, 2.2, 1.6, -foreAng, 0, Math.PI * 2);
                    wctx.fill();

                    return { wx, wy, foreAng };
                }

                const windSway = wind * -7.5 * dir;

                // 1. Back Arm
                const backArmAng = armReach !== 0 ? armReach * 0.6 : stride * 0.75;
                const sleeveColor = role === 'boy' ? '#f8f9fa' : role === 'mother' ? '#a93226' : role === 'grandmother' ? '#f2ece1' : role === 'childGirl' ? '#e67e22' : role === 'childBoy' ? '#48c9b0' : null;
                drawArm(-1.5, shoulderY + 2, backArmAng, 0.35, true, sleeveColor);

                // 2. Legs & Lower Garments
                if (isSitting) {
                    if (role === 'grandmother' || role === 'mother') {
                        // Cross-legged draped saree base on veranda / near stove
                        wctx.fillStyle = role === 'grandmother' ? '#f2ece1' : '#e6d7c3';
                        wctx.beginPath();
                        wctx.moveTo(-8, shoulderY + 10);
                        wctx.quadraticCurveTo(14, hipY - 5, 13, 1);
                        wctx.lineTo(-9, 1);
                        wctx.closePath();
                        wctx.fill();
                        // Saree decorative border (Paar) along hem
                        wctx.fillStyle = role === 'grandmother' ? '#8c6d46' : '#c0392b';
                        wctx.fillRect(-9, -2.5, 22, 3);
                    } else {
                        // Seated knees-drawn-up pose for farmer, schoolboy, and children on veranda
                        wctx.fillStyle = role === 'farmer' ? '#24593f' : role === 'boy' ? '#1f3a60' : '#34495e';
                        wctx.beginPath();
                        wctx.ellipse(3, -5, 10, 5.5, 0, 0, Math.PI * 2);
                        wctx.fill();
                        wctx.strokeStyle = skinBase;
                        wctx.lineWidth = 3.2;
                        wctx.beginPath();
                        wctx.moveTo(5, -9);
                        wctx.lineTo(8, -1);
                        wctx.stroke();
                    }
                } else {
                    // Standing / Walking / Running Legs
                    drawLeg(-1.5, oppStride, kneeBendB, true);
                    drawLeg(1.5, stride, kneeBendA, false);

                    if (role === 'mother') {
                        // Draped Cotton Tant Saree Skirt with pleated Kuchi folds & Crimson Paar border
                        wctx.fillStyle = '#e8d8c5';
                        wctx.beginPath();
                        wctx.moveTo(-6.5, hipY - 2);
                        wctx.lineTo(6.5, hipY - 2);
                        wctx.lineTo(8.5 + windSway * 0.45 + Math.sin(walkPhase) * 3, -2.5);
                        wctx.lineTo(-7.5 + windSway * 0.45 - Math.sin(walkPhase) * 2, -2.5);
                        wctx.closePath();
                        wctx.fill();
                        // Vertical kuchi pleat lines
                        wctx.strokeStyle = 'rgba(160, 120, 95, 0.45)';
                        wctx.lineWidth = 1;
                        [-2, 1, 4].forEach(px => {
                            wctx.beginPath();
                            wctx.moveTo(px, hipY);
                            wctx.lineTo(px + windSway * 0.35, -3);
                            wctx.stroke();
                        });
                        // Deep crimson saree border (Paar) at bottom
                        wctx.fillStyle = '#b82921';
                        wctx.fillRect(-7.5 + windSway * 0.45, -5.5, 16, 3.2);
                    } else if (role === 'farmer') {
                        // Checkered Cotton Lungi (folded knee-length while working in paddy, full length when walking)
                        const lungiBot = timeSec < 36 ? -10 - bob : -4 - bob;
                        wctx.fillStyle = '#24593f';
                        wctx.beginPath();
                        wctx.moveTo(-6.5, hipY - 2);
                        wctx.lineTo(6.5, hipY - 2);
                        wctx.lineTo(7.8 + windSway * 0.35, lungiBot);
                        wctx.lineTo(-7.5 + windSway * 0.35, lungiBot);
                        wctx.closePath();
                        wctx.fill();
                        // Checkered grid lines on lungi
                        wctx.strokeStyle = 'rgba(220, 235, 225, 0.28)';
                        wctx.lineWidth = 0.9;
                        wctx.beginPath();
                        wctx.moveTo(-5, (hipY + lungiBot) * 0.5);
                        wctx.lineTo(6, (hipY + lungiBot) * 0.5);
                        wctx.moveTo(0, hipY - 2);
                        wctx.lineTo(0 + windSway * 0.2, lungiBot);
                        wctx.stroke();
                    } else if (role === 'childGirl') {
                        // Flared 1990s pleated cotton frock skirt
                        wctx.fillStyle = '#e67e22';
                        wctx.beginPath();
                        wctx.moveTo(-5.5, hipY - 3);
                        wctx.lineTo(5.5, hipY - 3);
                        wctx.lineTo(9 + windSway * 0.3, -9 - bob);
                        wctx.lineTo(-9 + windSway * 0.3, -9 - bob);
                        wctx.closePath();
                        wctx.fill();
                        wctx.fillStyle = '#f8c471';
                        wctx.fillRect(-8.5 + windSway * 0.3, -11 - bob, 17, 2);
                    } else {
                        // Navy school shorts / trousers for schoolboy & childBoy
                        wctx.fillStyle = role === 'boy' ? '#1b3358' : '#2c3e50';
                        wctx.beginPath();
                        wctx.moveTo(-6, hipY - 2);
                        wctx.lineTo(6, hipY - 2);
                        wctx.lineTo(6.5 + Math.sin(stride) * 3, -10 - bob);
                        wctx.lineTo(-6.5 + Math.sin(oppStride) * 3, -10 - bob);
                        wctx.closePath();
                        wctx.fill();
                    }
                }

                // 3. Sculpted Torso & Upper Garments
                if (role === 'mother') {
                    // Fitted crimson blouse + diagonally draped Tant Saree chest pallu
                    wctx.fillStyle = '#a93226';
                    wctx.beginPath();
                    wctx.moveTo(-6, shoulderY);
                    wctx.lineTo(6, shoulderY);
                    wctx.lineTo(5.5, hipY);
                    wctx.lineTo(-5.5, hipY);
                    wctx.closePath();
                    wctx.fill();
                    // Diagonal cream-and-crimson saree drape across torso
                    wctx.fillStyle = '#e8d8c5';
                    wctx.beginPath();
                    wctx.moveTo(-6, shoulderY);
                    wctx.lineTo(2, shoulderY);
                    wctx.lineTo(6, hipY);
                    wctx.lineTo(-4, hipY);
                    wctx.closePath();
                    wctx.fill();
                    wctx.strokeStyle = '#b82921';
                    wctx.lineWidth = 2.0;
                    wctx.beginPath();
                    wctx.moveTo(1.5, shoulderY);
                    wctx.lineTo(5.8, hipY);
                    wctx.stroke();

                    // Flowing Saree Anchal (Pallu) billowing behind shoulder in wind
                    const anchalWave = windSway * 1.45 + Math.sin(walkPhase * 1.3 + timeSec * 2) * 3.5;
                    wctx.fillStyle = '#e8d8c5';
                    wctx.beginPath();
                    wctx.moveTo(-5, shoulderY + 1);
                    wctx.quadraticCurveTo(-15 + anchalWave, shoulderY + 7, -21 + anchalWave * 1.25, shoulderY + 18);
                    wctx.lineTo(-12 + anchalWave, shoulderY + 21);
                    wctx.closePath();
                    wctx.fill();
                    // Crimson-and-gold decorative end stripes on the Anchal
                    wctx.fillStyle = '#b82921';
                    wctx.beginPath();
                    wctx.moveTo(-21 + anchalWave * 1.25, shoulderY + 18);
                    wctx.lineTo(-12 + anchalWave, shoulderY + 21);
                    wctx.lineTo(-10 + anchalWave * 0.9, shoulderY + 16);
                    wctx.lineTo(-18 + anchalWave * 1.1, shoulderY + 13);
                    wctx.closePath();
                    wctx.fill();
                } else if (role === 'grandmother') {
                    // Soft ivory-white Thaansaree / border saree wrapped warmly around torso & shoulders
                    wctx.fillStyle = '#f2ece1';
                    wctx.beginPath();
                    wctx.roundRect(-7, shoulderY - 1, 14, hipY - shoulderY + 4, 4);
                    wctx.fill();
                    wctx.strokeStyle = '#8c6d46';
                    wctx.lineWidth = 1.6;
                    wctx.beginPath();
                    wctx.moveTo(-5, shoulderY + 1);
                    wctx.quadraticCurveTo(2, shoulderY + 8, 6, hipY);
                    wctx.stroke();
                } else if (role === 'farmer') {
                    // Bare sun-bronzed muscular torso with red checkered Gamcha towel draped over shoulders
                    wctx.fillStyle = skinBase;
                    wctx.beginPath();
                    wctx.moveTo(-6.5, shoulderY);
                    wctx.lineTo(6.5, shoulderY);
                    wctx.lineTo(5.2, hipY);
                    wctx.lineTo(-5.2, hipY);
                    wctx.closePath();
                    wctx.fill();
                    // Red Gamcha towel around neck/shoulders with white end fringe
                    wctx.fillStyle = '#c0392b';
                    wctx.beginPath();
                    wctx.moveTo(-6.8, shoulderY - 1);
                    wctx.lineTo(6.8, shoulderY - 1);
                    wctx.lineTo(6.2, shoulderY + 6);
                    wctx.lineTo(-6.5 + windSway * 0.4, shoulderY + 9);
                    wctx.closePath();
                    wctx.fill();
                    wctx.fillStyle = '#f5f5f0';
                    wctx.fillRect(-6.5 + windSway * 0.4, shoulderY + 8, 5, 1.8);
                } else if (role === 'boy') {
                    // Crisp white collared school shirt with button placket
                    wctx.fillStyle = '#f8f9fa';
                    wctx.beginPath();
                    wctx.moveTo(-6, shoulderY);
                    wctx.lineTo(6, shoulderY);
                    wctx.lineTo(5.5, hipY);
                    wctx.lineTo(-5.5, hipY);
                    wctx.closePath();
                    wctx.fill();
                    // Shirt collar & pocket
                    wctx.strokeStyle = '#cbd5e1';
                    wctx.lineWidth = 1;
                    wctx.beginPath();
                    wctx.moveTo(-2, shoulderY);
                    wctx.lineTo(1, shoulderY + 4);
                    wctx.lineTo(4, shoulderY);
                    wctx.stroke();
                    // Cross-body cloth school bag (Jhola) when walking
                    if (!isSitting) {
                        const bagSway = Math.sin(walkPhase) * 2.5 + windSway * 0.4;
                        wctx.strokeStyle = '#34495e';
                        wctx.lineWidth = 1.8;
                        wctx.beginPath();
                        wctx.moveTo(3, shoulderY);
                        wctx.lineTo(-6 + bagSway, hipY + 1);
                        wctx.stroke();
                        wctx.fillStyle = '#4a6984';
                        wctx.beginPath();
                        wctx.roundRect(-10.5 + bagSway, hipY - 2, 9.5, 8.5, 2);
                        wctx.fill();
                        wctx.fillStyle = '#d4ac6e';
                        wctx.fillRect(-9 + bagSway, hipY - 2, 6.5, 2);
                    }
                } else {
                    // Children's tops (pleated frock bodice for girl, striped t-shirt for boy)
                    wctx.fillStyle = role === 'childGirl' ? '#e67e22' : '#48c9b0';
                    wctx.beginPath();
                    wctx.roundRect(-5.5, shoulderY, 11, hipY - shoulderY + 2, 3);
                    wctx.fill();
                    if (role === 'childBoy') {
                        wctx.fillStyle = '#f4d03f';
                        wctx.fillRect(-5.5, shoulderY + 5, 11, 2.5);
                    }
                }

                // 4. Sculpted Neck, Head, Facial Features & Authentic Hair/Headwear
                // Neck
                wctx.fillStyle = skinShadow;
                wctx.fillRect(-2, shoulderY - 4, 4, 5);

                const headY = shoulderY - 9.5;
                // Sculpted head with slight chin/jaw contour facing right (+x)
                wctx.fillStyle = skinBase;
                wctx.beginPath();
                wctx.arc(0, headY, 5.8, 0, Math.PI * 2);
                wctx.fill();
                // Nose bridge & chin profile
                wctx.beginPath();
                wctx.moveTo(4.5, headY - 2.5);
                wctx.lineTo(6.8, headY + 0.2);
                wctx.lineTo(5.0, headY + 1.5);
                wctx.closePath();
                wctx.fill();

                // Ear
                wctx.fillStyle = skinShadow;
                wctx.beginPath();
                wctx.ellipse(-1.2, headY + 0.5, 1.3, 2.2, -0.1, 0, Math.PI * 2);
                wctx.fill();
                // Gold nose pin / earring stud for mother
                if (role === 'mother') {
                    wctx.fillStyle = '#f1c40f';
                    wctx.beginPath();
                    wctx.arc(-1.2, headY + 2.2, 0.9, 0, Math.PI * 2);
                    wctx.fill();
                }

                // Expressive Eye & Eyebrow (with occasional natural blink)
                const isBlinking = Math.sin(timeSec * 3.1 + x * 0.1) > 0.96;
                wctx.strokeStyle = '#1a1412';
                wctx.lineWidth = 0.9;
                wctx.beginPath();
                wctx.moveTo(2.0, headY - 2.4);
                wctx.quadraticCurveTo(3.5, headY - 3.0, 4.8, headY - 2.2);
                wctx.stroke();
                if (!isBlinking) {
                    wctx.fillStyle = '#14100e';
                    wctx.beginPath();
                    wctx.arc(3.4, headY - 0.9, 0.95, 0, Math.PI * 2);
                    wctx.fill();
                }

                // Hair & Headwear by Character Role
                if (role === 'mother') {
                    // Oiled black hair swept back into a large traditional Khopa bun with red ribbon
                    wctx.fillStyle = '#171311';
                    wctx.beginPath();
                    wctx.arc(-0.8, headY - 1.2, 6.0, Math.PI * 0.78, Math.PI * 2.08);
                    wctx.fill();
                    const bunBob = Math.sin(walkPhase) * 0.8;
                    wctx.beginPath();
                    wctx.arc(-7.4, headY + 0.5 + bunBob, 3.8, 0, Math.PI * 2);
                    wctx.fill();
                    wctx.strokeStyle = '#c0392b';
                    wctx.lineWidth = 1.2;
                    wctx.beginPath();
                    wctx.arc(-5.6, headY + 0.5 + bunBob, 3.2, -1.2, 1.2);
                    wctx.stroke();
                    // Small crimson Bindi (Tip) on forehead
                    wctx.fillStyle = '#c0392b';
                    wctx.beginPath();
                    wctx.arc(5.1, headY - 2.2, 0.8, 0, Math.PI * 2);
                    wctx.fill();
                } else if (role === 'grandmother') {
                    // Silver-white hair + ivory-white Saree Ghomta (head veil) draped over crown
                    wctx.fillStyle = '#d5d1c8';
                    wctx.beginPath();
                    wctx.arc(-0.5, headY - 1, 5.9, Math.PI * 0.8, Math.PI * 2.1);
                    wctx.fill();
                    wctx.fillStyle = '#f2ece1';
                    wctx.beginPath();
                    wctx.arc(-1.2, headY - 0.5, 6.4, Math.PI * 0.65, Math.PI * 1.95);
                    wctx.lineTo(-4, shoulderY + 3);
                    wctx.lineTo(-7, shoulderY + 1);
                    wctx.closePath();
                    wctx.fill();
                    wctx.strokeStyle = '#8c6d46';
                    wctx.lineWidth = 1.2;
                    wctx.stroke();
                } else if (role === 'childGirl') {
                    // Dark hair with braided pigtail (Benu) & red ribbon flying in wind
                    wctx.fillStyle = '#171311';
                    wctx.beginPath();
                    wctx.arc(-0.6, headY - 1.2, 6.0, Math.PI * 0.78, Math.PI * 2.1);
                    wctx.fill();
                    wctx.strokeStyle = '#171311';
                    wctx.lineWidth = 2.4;
                    wctx.beginPath();
                    wctx.moveTo(-5.5, headY + 1);
                    wctx.quadraticCurveTo(-10 + windSway * 0.4, headY + 4, -12 + windSway * 0.7, headY + 8);
                    wctx.stroke();
                    wctx.fillStyle = '#e74c3c';
                    wctx.beginPath();
                    wctx.arc(-12 + windSway * 0.7, headY + 8, 1.8, 0, Math.PI * 2);
                    wctx.fill();
                } else {
                    // Short dark village haircut for farmer, schoolboy & childBoy
                    wctx.fillStyle = '#171311';
                    wctx.beginPath();
                    wctx.arc(-0.6, headY - 1.4, 6.0, Math.PI * 0.82, Math.PI * 2.12);
                    wctx.fill();
                }

                // Farmer's Woven Conical Bamboo Hat (Mathal) when outdoors
                if (role === 'farmer' && !isSitting) {
                    const mGrad = wctx.createLinearGradient(-13, headY - 13, 13, headY - 3);
                    mGrad.addColorStop(0, '#d8b467');
                    mGrad.addColorStop(1, '#9c7834');
                    wctx.fillStyle = mGrad;
                    wctx.beginPath();
                    wctx.moveTo(-13.5, headY - 3);
                    wctx.quadraticCurveTo(0, headY - 14.5, 13.5, headY - 3);
                    wctx.quadraticCurveTo(0, headY - 5, -13.5, headY - 3);
                    wctx.fill();
                    wctx.strokeStyle = '#6e5120';
                    wctx.lineWidth = 1.1;
                    wctx.stroke();
                }

                // 5. Front Arm & Hand-Held Props (Palm-leaf fan, sickle, kite spool)
                const frontArmAng = armReach !== 0 ? armReach : -stride * 0.85;
                const frontElbow = armReach !== 0 ? -0.45 : 0.42;
                const handPos = drawArm(1.5, shoulderY + 2, frontArmAng, frontElbow, false, sleeveColor);

                // Grandmother's hand-woven palm-leaf fan (Taler Pakha) gently waving
                if (role === 'grandmother' && timeSec < 52) {
                    const fanRot = Math.sin(timeSec * 4.2) * 0.35;
                    wctx.save();
                    wctx.translate(handPos.wx, handPos.wy);
                    wctx.rotate(fanRot);
                    wctx.strokeStyle = '#6e4e2a';
                    wctx.lineWidth = 1.2;
                    wctx.beginPath();
                    wctx.moveTo(0, 0);
                    wctx.lineTo(7, -5);
                    wctx.stroke();
                    wctx.fillStyle = '#d4b475';
                    wctx.beginPath();
                    wctx.arc(6, -6, 5.2, 0, Math.PI * 2);
                    wctx.fill();

                        const ang = 0.38 + r * 0.13 + Math.sin(t * 0.25 + r) * 0.02;
                        const rayGrad = wctx.createLinearGradient(sunX, sunY, sunX + Math.cos(ang) * 780, sunY + Math.sin(ang) * 780);
                        rayGrad.addColorStop(0, `rgba(255, 224, 158, ${0.14 * godRays})`);
                        rayGrad.addColorStop(0.65, `rgba(255, 205, 130, ${0.05 * godRays})`);
                        rayGrad.addColorStop(1, 'rgba(255, 190, 110, 0)');
                        wctx.fillStyle = rayGrad;
                        wctx.beginPath();
                        wctx.moveTo(sunX - 18, sunY);
                        wctx.lineTo(sunX + Math.cos(ang - 0.04) * 900, sunY + Math.sin(ang - 0.04) * 900);
                        wctx.lineTo(sunX + Math.cos(ang + 0.04) * 900, sunY + Math.sin(ang + 0.04) * 900);
                        wctx.closePath();
                        wctx.fill();
                    }
                    wctx.restore();
                }

                if (mist > 0.01) {
                    wctx.save();
                    for (let m = 0; m < 4; m++) {
                        const my = 445 + m * 58;
                        const mx = ((t * (8 + m * 3)) % 400) - 200;
                        const mGrad = wctx.createLinearGradient(0, my - 28, 0, my + 34);
                        mGrad.addColorStop(0, 'rgba(252, 236, 214, 0)');
                        mGrad.addColorStop(0.5, `rgba(252, 236, 214, ${mist * (0.26 - m * 0.03)})`);
                        mGrad.addColorStop(1, 'rgba(252, 236, 214, 0)');
                        wctx.fillStyle = mGrad;
                        wctx.fillRect(mx, my - 28, WORLD_W + 400, 64);
                    }
                    wctx.restore();
                }

                if (stoveSmoke > 0.01) {
                    wctx.save();
                    for (const sp of smokePuffs) {
                        sp.age = (sp.age + dt * 0.22) % 1.0;
                        const u = sp.age;
                        const sx = 874 + u * (24 + wind * 85) + Math.sin(u * 8 + sp.seed) * 9;
                        const sy = 528 - u * 115;
                        const rad = 5 + u * 22;
                        const alpha = Math.sin(u * Math.PI) * 0.26 * stoveSmoke;
                        wctx.fillStyle = `rgba(232, 224, 212, ${alpha})`;
                        wctx.beginPath();
                        wctx.arc(sx, sy, rad, 0, Math.PI * 2);
                        wctx.fill();
                    }
                    wctx.restore();
                }

                if (stormCloud > 0.2 && rain < 0.5) {
                    wctx.save();
                    wctx.fillStyle = '#5c4b28';
                    for (let l = 0; l < 18; l++) {
                        const lx = ((t * (190 + l * 15) + l * 97) % WORLD_W);
                        const ly = 360 + ((l * 53) % 280) + Math.sin(t * 5 + l) * 24;
                        wctx.save();
                        wctx.translate(lx, ly);
                        wctx.rotate(t * 6 + l);
                        wctx.beginPath();
                        wctx.ellipse(0, 0, 4.5, 2, 0, 0, Math.PI * 2);
                        wctx.fill();
                        wctx.restore();
                    }
                    wctx.restore();
                }

                if (rain > 0.01) {
                    wctx.save();
                    const slantX = 95 + wind * 140;

                    for (const rp of ripples) {
                        rp.r += dt * rp.speed * (0.6 + rain * 0.8);
                        if (rp.r > rp.maxR) rp.r = 0.5;
                    }

                    for (const rd of raindrops) {
                        const speed = rd.speed * (reducedMotion ? 0.55 : 1.0);
                        rd.y += dt * speed;
                        rd.x += dt * slantX * (0.7 + rd.depth * 0.2);
                        if (rd.y > WORLD_H) {
                            rd.y = -20;
                            rd.x = ((rd.x % (WORLD_W + 400)) + (WORLD_W + 400)) % (WORLD_W + 400) - 200;
                        }
                        const alpha = (0.16 + rd.depth * 0.11) * rain;
                        wctx.strokeStyle = `rgba(205, 224, 238, ${alpha})`;
                        wctx.lineWidth = 0.9 + rd.depth * 0.45;
                        wctx.beginPath();
                        wctx.moveTo(rd.x, rd.y);
                        wctx.lineTo(rd.x + slantX * 0.035, rd.y + rd.len);
                        wctx.stroke();
                    }

                    wctx.strokeStyle = `rgba(200, 222, 238, ${0.38 * rain})`;
                    wctx.lineWidth = 1.3;
                    for (let rx = 958; rx <= 1332; rx += 22) {
                        const streamLen = 22 + Math.sin(t * 14 + rx) * 8;
                        wctx.beginPath();
                        wctx.moveTo(rx, 416);
                        wctx.lineTo(rx + wind * 8, 416 + streamLen);
                        wctx.stroke();
                    }

                    const dripCycle = (t * 3.4) % 1.0;
                    const dripY = lerp(416, 491, dripCycle * dripCycle);
                    wctx.fillStyle = `rgba(220, 240, 255, ${0.85 * rain})`;
                    wctx.beginPath();
                    wctx.ellipse(1181, dripY, 1.6, 3.4, 0, 0, Math.PI * 2);
                    wctx.fill();
                    if (dripCycle > 0.82) {
                        const sR = (dripCycle - 0.82) * 35;
                        wctx.strokeStyle = `rgba(225, 242, 255, ${(1 - (dripCycle - 0.82) * 5.5) * rain})`;
                        wctx.lineWidth = 1.1;
                        wctx.beginPath();
                        wctx.ellipse(1181, 491, sR, sR * 0.35, 0, 0, Math.PI * 2);
                        wctx.stroke();
                    }

                    wctx.restore();
                }

                if (pal.shadowAlpha > 0.02) {
                    wctx.save();
                    wctx.fillStyle = `rgba(14, 22, 38, ${pal.shadowAlpha})`;
                    wctx.fillRect(0, 0, WORLD_W, WORLD_H);
                    wctx.restore();
                }

                if (nightLife > 0.01) {
                    wctx.save();
                    wctx.globalCompositeOperation = 'screen';
                    for (const ff of fireflies) {
                        ff.x = ((ff.x + dt * ff.speedX) + WORLD_W) % WORLD_W;
                        ff.y = clamp(ff.y + Math.sin(t * 1.8 + ff.phase) * dt * 12, 390, 820);
                        const pulse = Math.pow(0.5 + 0.5 * Math.sin(t * 3.6 + ff.phase), 2.2) * nightLife;
                        if (pulse < 0.05) continue;

                        const ffGlow = wctx.createRadialGradient(ff.x, ff.y, 0.5, ff.x, ff.y, 14);
                        ffGlow.addColorStop(0, `rgba(235, 255, 130, ${pulse * 0.95})`);
                        ffGlow.addColorStop(0.4, `rgba(180, 235, 65, ${pulse * 0.45})`);
                        ffGlow.addColorStop(1, 'rgba(140, 210, 40, 0)');
                        wctx.fillStyle = ffGlow;
                        wctx.beginPath();
                        wctx.arc(ff.x, ff.y, 14, 0, Math.PI * 2);
                        wctx.fill();
                    }
                    wctx.restore();
                }
            }

            // ============================================================================
            // 8. STAGE 4: BENGALI TITLE CARD & WARM 1990s FILM FINISH (GRAIN + VIGNETTE)
            // ============================================================================
            function drawFilmFinishAndTitle(ctxScreen, w, h, state) {

                ctxScreen.save();

                vig.addColorStop(0.7, 'rgba(22, 14, 8, 0.14)');

                if (activeStage === 4 && !reducedMotion) {
                    const ox = Math.floor((t * 24) % 9) * 19;

                if (t > 0.6 && t < 9.0) {

                    ctxScreen.fillText('ফেলে আসা গ্রাম', cx, cy);

                    ctxScreen.shadowBlur = 6;
                    ctxScreen.strokeStyle = 'rgba(245, 203, 134, 0.82)';
                    ctxScreen.lineWidth = 2;
                    ctxScreen.beginPath();
                    ctxScreen.moveTo(cx - titleSize * 2.1, cy + titleSize * 0.65);
                    ctxScreen.quadraticCurveTo(cx, cy + titleSize * 0.78, cx + titleSize * 2.1, cy + titleSize * 0.62);
                    ctxScreen.stroke();

                    ctxScreen.font = `400 ${Math.round(titleSize * 0.36)}px -apple-system, BlinkMacSystemFont, "Segoe UI", serif`;
                    ctxScreen.fillStyle = 'rgba(255, 238, 208, 0.88)';
                    ctxScreen.fillText('A 1990s Bengali Village Memory', cx, cy + titleSize * 1.15);
                    ctxScreen.restore();
                }
            }

            // ============================================================================
            // 9. INTERACTIVE VILLAGE AUDIO ENGINE & UNAMPLIFIED VOCAL AZAN SYNTHESIZER
            // ============================================================================
            let audioCtx = null;
            let isMuted = false; // Interactive from the very beginning!
            let masterGain = null;
            let openAirReverb = null;
            let reverbSend = null;

            // Continuous environmental channels
            let windGain = null;
            let windFilter = null;
            let leavesGain = null;
            let rainGain = null;
            let tinRoofGain = null;
            let stoveCrackleGain = null;
            let padGain = null;

            // Scheduled & interactive state
            let nextBirdTime = 0.6;
            let nextRoosterTime = 2.2;
            let nextOarTime = 1.5;
            let nextFluteTime = 3.5;
            let nextCricketTime = 0;
            let nextDripTime = 0;
            let lastThunderTrigger = -10;
            let azanActiveUntil = 0;
            let lastAutoAzanWindow = -1;

            // Visual feedback ripples when user taps interactive objects or when Azan floats from mosque
            const soundRipples = [];
            let tubewellPumpAnim = 0;

            function spawnSoundRipple(x, y, label, color = 'rgba(255, 236, 185, 0.85)') {
                soundRipples.push({ x, y, r: 4, maxR: 58, alpha: 1.0, label, color });
            }

            // Create a stereo Open-Air Village Impulse Response (paddy fields, distant trees & river water reflection)
            function createOpenAirImpulse(ac) {
                const duration = 2.6;
                const len = Math.floor(ac.sampleRate * duration);
                const buf = ac.createBuffer(2, len, ac.sampleRate);
                for (let ch = 0; ch < 2; ch++) {
                    const d = buf.getChannelData(ch);
                    let lp = 0;
                    for (let i = 0; i < len; i++) {
                        const t = i / ac.sampleRate;
                        // Soft pre-delay + smooth natural open-field decay (no metallic room reflections)
                        const env = Math.pow(1 - t / duration, 2.4) * Math.sin(Math.min(1, t * 18) * Math.PI * 0.5);
                        const white = Math.random() * 2 - 1;
                        lp = 0.88 * lp + 0.12 * white; // warm air absorption damping high frequencies
                        d[i] = lp * env * 0.38;
                    }
                }
                return buf;
            }

            function initAudioEngine() {
                if (audioCtx) return;
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                audioCtx = new AC();

                masterGain = audioCtx.createGain();
                masterGain.gain.value = isMuted ? 0.0001 : 0.90;
                masterGain.connect(audioCtx.destination);

                // Open-air village field convolution reverb for distant Azan, birds, and bamboo flute
                openAirReverb = audioCtx.createConvolver();
                openAirReverb.buffer = createOpenAirImpulse(audioCtx);
                reverbSend = audioCtx.createGain();
                reverbSend.gain.value = 0.55;
                reverbSend.connect(openAirReverb);
                openAirReverb.connect(masterGain);

                // 4-second organic pink/brown noise buffer
                const bufLen = audioCtx.sampleRate * 4;
                const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
                const data = noiseBuf.getChannelData(0);
                let b0 = 0, b1 = 0, b2 = 0;
                for (let i = 0; i < bufLen; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.997 * b0 + white * 0.029;
                    b1 = 0.985 * b1 + white * 0.032;
                    b2 = 0.950 * b2 + white * 0.048;
                    data[i] = (b0 + b1 + b2 + white * 0.10) * 0.35;
                }

                function makeLoopSource() {
                    const s = audioCtx.createBufferSource();
                    s.buffer = noiseBuf;
                    s.loop = true;
                    s.start();
                    return s;
                }

                // 1. Warm Village Wind across paddy fields
                const windSrc = makeLoopSource();
                windFilter = audioCtx.createBiquadFilter();
                windFilter.type = 'bandpass';
                windFilter.frequency.value = 240;
                windFilter.Q.value = 2.0;
                windGain = audioCtx.createGain();
                windGain.gain.value = 0.035;
                windSrc.connect(windFilter).connect(windGain).connect(masterGain);

                // 2. Rustling Palm & Bamboo Leaves (higher, softer airy rustle)
                const leavesSrc = makeLoopSource();
                const leavesFilter = audioCtx.createBiquadFilter();
                leavesFilter.type = 'bandpass';
                leavesFilter.frequency.value = 920;
                leavesFilter.Q.value = 1.4;
                leavesGain = audioCtx.createGain();
                leavesGain.gain.value = 0.015;
                leavesSrc.connect(leavesFilter).connect(leavesGain).connect(masterGain);

                // 3. Silky Monsoon Rain + Warm Corrugated Tin-Roof Patter
                const rainSrc = makeLoopSource();
                const rainFilter = audioCtx.createBiquadFilter();
                rainFilter.type = 'bandpass';
                rainFilter.frequency.value = 1280;
                rainFilter.Q.value = 0.65;
                rainGain = audioCtx.createGain();
                rainGain.gain.value = 0.0;
                rainSrc.connect(rainFilter).connect(rainGain).connect(masterGain);

                const tinSrc = makeLoopSource();
                const tinFilter = audioCtx.createBiquadFilter();
                tinFilter.type = 'bandpass';
                tinFilter.frequency.value = 480;
                tinFilter.Q.value = 2.2;
                tinRoofGain = audioCtx.createGain();
                tinRoofGain.gain.value = 0.0;
                tinSrc.connect(tinFilter).connect(tinRoofGain).connect(masterGain);

                // 4. Morning Clay Stove Woodfire Soft Crackle
                const stoveSrc = makeLoopSource();
                const stoveFilter = audioCtx.createBiquadFilter();
                stoveFilter.type = 'highpass';
                stoveFilter.frequency.value = 1800;
                stoveCrackleGain = audioCtx.createGain();
                stoveCrackleGain.gain.value = 0.008;
                stoveSrc.connect(stoveFilter).connect(stoveCrackleGain).connect(masterGain);

                // 5. Gentle Warm Village Atmosphere Bed (very subtle tanpura-like root & fifth: D3 + A3)
                padGain = audioCtx.createGain();
                padGain.gain.value = 0.028;
                const padFilter = audioCtx.createBiquadFilter();
                padFilter.type = 'lowpass';
                padFilter.frequency.value = 340;
                padFilter.connect(padGain).connect(masterGain);

                [146.83, 220.0].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const oGain = audioCtx.createGain();
                    osc.type = idx === 0 ? 'sine' : 'triangle';
                    osc.frequency.value = freq;
                    oGain.gain.value = idx === 0 ? 0.25 : 0.16;
                    osc.connect(oGain).connect(padFilter);
                    osc.start();
                });
            }

            // --------------------------------------------------------------------------
            // UNAMPLIFIED HUMAN-VOICE AZAN SYNTHESIZER (No Microphone / No Horn PA)
            // Uses Glottal Harmonic Series + 3 Parallel Vowel Formant Filters (F1,F2,F3)
            // + Natural Vibrato + Open-Air Distance Filtering & Field Reverb
            // --------------------------------------------------------------------------
            function triggerUnamplifiedAzan(startOffset = 0) {
                if (!audioCtx || isMuted) return;
                const now = audioCtx.currentTime + startOffset;
                if (now < azanActiveUntil - 1.0) return; // already calling Azan

                // Create a rich periodic glottal vocal wave (warm human vocal cords, no harsh clipping)
                const real = new Float32Array(24);
                const imag = new Float32Array(24);
                for (let k = 1; k < 24; k++) {
                    // Natural human glottal roll-off (-12dB/octave) so voice is warm and chesty
                    imag[k] = 1.0 / Math.pow(k, 1.38);
                }
                const vocalWave = audioCtx.createPeriodicWave(real, imag);

                // Vowel Formant Table [F1, F2, F3] for natural Arabic vocal articulation
                const VOWELS = {
                    A: [730, 1190, 2440], // open warm "Allā..."
                    O: [540, 920, 2350],  // deep rounded "Allāhu..."
                    U: [350, 780, 2250],  // "-hu"
                    E: [490, 1720, 2420], // "Ash-ha-du..."
                    I: [320, 2120, 2700], // "-i-lā-ha / il-lā..."
                    M: [280, 900, 2150]   // soft nasal/liquid closure "l / m / n"
                };

                // Authentic, slow, contemplative Bengali village Maqam phrasing (root D3 = 146.83 Hz, Hijaz/Bhairav inflection):
                // D3=146.8, Eb3=155.6, F#3=185.0, G3=196.0, A3=220.0, Bb3=233.1, C4=261.6
                // Phrase 1 (0.0 - 6.8s): "Allāhu Akbar, Allāhu Akbar" (slow, rising, unhurried breath)
                // Phrase 2 (7.6 - 15.2s): "Ash-hadu an lā ilāha illāllāh" (soulful melismatic descent across the fields)
                const phrases = [
                    {
                        t0: 0.0, dur: 6.6,
                        notes: [
                            { t: 0.0, f: 196.0, v: 'A' }, // Al-
                            { t: 0.5, f: 220.0, v: 'O' }, // lā-
                            { t: 2.1, f: 233.1, v: 'O' }, // (melisma rise)
                            { t: 2.8, f: 220.0, v: 'U' }, // -hu
                            { t: 3.3, f: 196.0, v: 'A' }, // Ak-
                            { t: 3.9, f: 220.0, v: 'A' }, // -ba-
                            { t: 4.5, f: 185.0, v: 'O' }, // -a-
                            { t: 5.3, f: 196.0, v: 'A' }, // -ar...
                            { t: 6.4, f: 185.0, v: 'M' }
                        ]
                    },
                    {
                        t0: 7.4, dur: 7.4,
                        notes: [
                            { t: 0.0, f: 185.0, v: 'E' }, // Ash-ha-
                            { t: 0.9, f: 220.0, v: 'U' }, // -du
                            { t: 1.5, f: 233.1, v: 'A' }, // an lā
                            { t: 2.6, f: 261.6, v: 'I' }, // i-
                            { t: 3.2, f: 233.1, v: 'A' }, // -lā-ha
                            { t: 4.4, f: 220.0, v: 'I' }, // il-
                            { t: 5.0, f: 196.0, v: 'O' }, // -lāl-
                            { t: 5.8, f: 185.0, v: 'A' }, // -lā-
                            { t: 6.5, f: 146.8, v: 'A' }, // -āh... (gentle rest on tonic D3)
                            { t: 7.2, f: 146.8, v: 'M' }
                        ]
                    }
                ];

                azanActiveUntil = now + 15.2;
                const azanBtn = document.getElementById('azan-label');
                if (azanBtn) {
                    azanBtn.textContent = 'Azan Calling...';
                    setTimeout(() => {
                        if (azanBtn) azanBtn.textContent = 'Distant Azan';
                    }, 15000);
                }

                for (const ph of phrases) {
                    const pStart = now + ph.t0;
                    const pEnd = pStart + ph.dur;

                    const osc = audioCtx.createOscillator();
                    osc.setPeriodicWave(vocalWave);

                    // Natural human vocal vibrato (~5.1 Hz, gentle +-2.2 Hz depth)
                    const vib = audioCtx.createOscillator();
                    const vibGain = audioCtx.createGain();
                    vib.frequency.value = 5.1;
                    vibGain.gain.setValueAtTime(0.4, pStart);
                    vibGain.gain.linearRampToValueAtTime(2.3, pStart + 1.4);
                    vib.connect(vibGain).connect(osc.frequency);

                    // 3 Parallel Formant Bandpass Filters (F1, F2, F3) for authentic human vowel throat resonance
                    const f1 = audioCtx.createBiquadFilter();
                    const f2 = audioCtx.createBiquadFilter();
                    const f3 = audioCtx.createBiquadFilter();
                    [f1, f2, f3].forEach((f, idx) => {
                        f.type = 'bandpass';
                        f.Q.value = idx === 0 ? 5.5 : idx === 1 ? 7.0 : 8.5;
                    });
                    const f1Gain = audioCtx.createGain(); f1Gain.gain.value = 1.0;
                    const f2Gain = audioCtx.createGain(); f2Gain.gain.value = 0.52;
                    const f3Gain = audioCtx.createGain(); f3Gain.gain.value = 0.22;

                    // Schedule smooth pitch portamento & vowel formant morphing
                    for (let i = 0; i < ph.notes.length; i++) {
                        const n = ph.notes[i];
                        const nt = pStart + n.t;
                        const vw = VOWELS[n.v] || VOWELS.A;
                        if (i === 0) {
                            osc.frequency.setValueAtTime(n.f, nt);
                            f1.frequency.setValueAtTime(vw[0], nt);
                            f2.frequency.setValueAtTime(vw[1], nt);
                            f3.frequency.setValueAtTime(vw[2], nt);
                        } else {
                            // Smooth human vocal glide
                            osc.frequency.exponentialRampToValueAtTime(n.f, nt);
                            f1.frequency.exponentialRampToValueAtTime(vw[0], nt);
                            f2.frequency.exponentialRampToValueAtTime(vw[1], nt);
                            f3.frequency.exponentialRampToValueAtTime(vw[2], nt);
                        }
                    }

                    // Open-air distance low-pass filter (250m across misty fields absorbs harsh highs > 1750 Hz)
                    const airFilter = audioCtx.createBiquadFilter();
                    airFilter.type = 'lowpass';
                    airFilter.frequency.value = 1720;

                    // Subtle stereo panning (slightly left-of-center where the distant mosque sits across the river)
                    const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
                    if (panner) panner.pan.value = -0.28;

                    // Smooth human breath envelope (soft attack, expressive swell, gentle decay into open air)
                    const env = audioCtx.createGain();
                    env.gain.setValueAtTime(0.0001, pStart);
                    env.gain.linearRampToValueAtTime(0.095, pStart + 0.85);
                    env.gain.setValueAtTime(0.105, pEnd - 1.3);
                    env.gain.exponentialRampToValueAtTime(0.0001, pEnd);

                    osc.connect(f1); f1.connect(f1Gain); f1Gain.connect(airFilter);
                    osc.connect(f2); f2.connect(f2Gain); f2Gain.connect(airFilter);
                    osc.connect(f3); f3.connect(f3Gain); f3Gain.connect(airFilter);

                    if (panner) {
                        airFilter.connect(env).connect(panner);
                        // 35% direct distant voice + 65% open-field acoustic reflection!
                        const directGain = audioCtx.createGain();
                        directGain.gain.value = 0.42;
                        panner.connect(directGain).connect(masterGain);
                        panner.connect(reverbSend);
                    } else {
                        airFilter.connect(env);
                        env.connect(masterGain);
                        env.connect(reverbSend);
                    }

                    osc.start(pStart);
                    vib.start(pStart);
                    osc.stop(pEnd + 0.05);
                    vib.stop(pEnd + 0.05);
                }
            }

            // --------------------------------------------------------------------------
            // VILLAGE WILDLIFE, FOLK INSTRUMENTS & INTERACTIVE FOLEY SYNTHESIZERS
            // --------------------------------------------------------------------------

            // 1. Melodic Doel & Kokil (Asian Koel "Ku-oo") Bird Songs
            function triggerBirdCall(now, forceKoel = false) {
                if (!audioCtx || isMuted) return;
                const isKoel = forceKoel || Math.random() < 0.38;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';

                if (isKoel) {
                    // Classic rising two-note Bengali Kokil "Ku-ooo!"
                    const f0 = 980 + Math.random() * 90;
                    osc.frequency.setValueAtTime(f0, now);
                    osc.frequency.exponentialRampToValueAtTime(f0 * 1.26, now + 0.18);
                    osc.frequency.setValueAtTime(f0 * 1.05, now + 0.24);
                    osc.frequency.exponentialRampToValueAtTime(f0 * 1.42, now + 0.55);
                    g.gain.setValueAtTime(0.0001, now);
                    g.gain.linearRampToValueAtTime(0.032, now + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.004, now + 0.21);
                    g.gain.linearRampToValueAtTime(0.038, now + 0.28);
                    g.gain.exponentialRampToValueAtTime(0.0005, now + 0.62);
                    osc.connect(g);
                    g.connect(masterGain);
                    g.connect(reverbSend);
                    osc.start(now);
                    osc.stop(now + 0.65);
                } else {
                    // Sweet liquid Doel (Magpie Robin) morning whistle phrase
                    const base = 1560 + Math.random() * 380;
                    osc.frequency.setValueAtTime(base, now);
                    osc.frequency.exponentialRampToValueAtTime(base * 1.24, now + 0.09);
                    osc.frequency.exponentialRampToValueAtTime(base * 0.91, now + 0.22);
                    osc.frequency.exponentialRampToValueAtTime(base * 1.18, now + 0.34);
                    g.gain.setValueAtTime(0.0001, now);
                    g.gain.linearRampToValueAtTime(0.028, now + 0.04);
                    g.gain.exponentialRampToValueAtTime(0.0006, now + 0.38);
                    osc.connect(g);
                    g.connect(masterGain);
                    g.connect(reverbSend);
                    osc.start(now);
                    osc.stop(now + 0.40);
                }
            }

            // 2. Authentic 4-Syllable Village Rooster Crow ("Kuk-ku-ru-kuuu!")
            function triggerRoosterCrow(now) {
                if (!audioCtx || isMuted) return;
                const syllables = [
                    { t: 0.00, d: 0.11, f0: 520, f1: 680 },
                    { t: 0.14, d: 0.10, f0: 620, f1: 790 },
                    { t: 0.27, d: 0.12, f0: 580, f1: 860 },
                    { t: 0.42, d: 0.58, f0: 880, f1: 640 }
                ];
                for (const s of syllables) {
                    const osc = audioCtx.createOscillator();
                    const bpf = audioCtx.createBiquadFilter();
                    const g = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    bpf.type = 'bandpass';
                    bpf.frequency.value = 1150;
                    bpf.Q.value = 3.2;
                    osc.frequency.setValueAtTime(s.f0, now + s.t);
                    osc.frequency.exponentialRampToValueAtTime(s.f1, now + s.t + s.d);
                    g.gain.setValueAtTime(0.0001, now + s.t);
                    g.gain.linearRampToValueAtTime(0.026, now + s.t + 0.025);
                    g.gain.exponentialRampToValueAtTime(0.0005, now + s.t + s.d);
                    osc.connect(bpf).connect(g);
                    g.connect(masterGain);
                    g.connect(reverbSend);
                    osc.start(now + s.t);
                    osc.stop(now + s.t + s.d + 0.02);
                }
            }

            // 3. Nostalgic 1990s Tea-Stall Radio Bamboo Flute (Banshi) Bhatiyali Phrase
            function triggerTeaStallBanshi(now) {
                if (!audioCtx || isMuted) return;
                // Soft pentatonic Bhatiyali phrase on bamboo flute: A4 -> B4 -> D5 -> E5 -> D5 -> B4 -> A4
                const notes = [
                    { t: 0.0, d: 0.55, f: 440.0 },
                    { t: 0.5, d: 0.45, f: 493.88 },
                    { t: 0.9, d: 0.70, f: 587.33 },
                    { t: 1.55, d: 0.85, f: 659.25 },
                    { t: 2.35, d: 0.95, f: 587.33 }
                ];
                for (const n of notes) {
                    const osc = audioCtx.createOscillator();
                    const lpf = audioCtx.createBiquadFilter();
                    const g = audioCtx.createGain();
                    osc.type = 'triangle';
                    lpf.type = 'lowpass';
                    lpf.frequency.value = 1200; // warm medium-wave radio + bamboo tone
                    osc.frequency.setValueAtTime(n.f * 0.98, now + n.t);
                    osc.frequency.exponentialRampToValueAtTime(n.f, now + n.t + 0.08);
                    g.gain.setValueAtTime(0.0001, now + n.t);
                    g.gain.linearRampToValueAtTime(0.022, now + n.t + 0.08);
                    g.gain.exponentialRampToValueAtTime(0.0005, now + n.t + n.d);
                    osc.connect(lpf).connect(g);
                    g.connect(masterGain);
                    g.connect(reverbSend);
                    osc.start(now + n.t);
                    osc.stop(now + n.t + n.d + 0.02);
                }
            }

            // 4. Rhythmic Wooden Oar (Boitha) Water Dip & Pond Splash
            function triggerWaterSplash(now, intensity = 1.0) {
                if (!audioCtx || isMuted) return;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                const fStart = 240 + Math.random() * 80;
                osc.frequency.setValueAtTime(fStart, now);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.14);
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(0.028 * intensity, now + 0.03);
                g.gain.exponentialRampToValueAtTime(0.0005, now + 0.18);
                osc.connect(g).connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.20);

            // 5. Cast-Iron Hand Tubewell (Chapakol) Pump Creak & Cool Water Gush
            function triggerTubewellPump(now) {
                if (!audioCtx || isMuted) return;

                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();

                osc.frequency.linearRampToValueAtTime(490, now + 0.32);
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(0.025, now + 0.05);
                g.gain.exponentialRampToValueAtTime(0.0005, now + 0.35);
                osc.connect(g).connect(masterGain);
                osc.start(now);
                osc.stop(now + 0.36);

            // 6. Warm Distant Cow Lowing ("Hamba")
            function triggerCowLow(now) {

                osc.frequency.exponentialRampToValueAtTime(118, now + 1.15);
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(0.032, now + 0.2);

            function triggerBucketDrip(now) {

                osc.frequency.setValueAtTime(590 + Math.random() * 40, now);

            function triggerCricketOrFrog(now, isFrog) {
                if (!audioCtx || isMuted) return;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                if (isFrog) {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(165, now);
                    osc.frequency.linearRampToValueAtTime(218, now + 0.14);
                    g.gain.setValueAtTime(0.001, now);
                    g.gain.linearRampToValueAtTime(0.026, now + 0.04);
                    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.19);
                    osc.connect(g);
                    g.connect(masterGain);
                    g.connect(reverbSend);
                    osc.start(now);
                    osc.stop(now + 0.21);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(4120 + Math.random() * 220, now);
                    g.gain.setValueAtTime(0.001, now);
                    g.gain.linearRampToValueAtTime(0.012, now + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.12);
                    osc.connect(g).connect(masterGain);
                    osc.start(now);
                    osc.stop(now + 0.13);
