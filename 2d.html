            function triggerThunder(now) {
                if (!audioCtx || isMuted) return;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(68, now);
                osc.frequency.exponentialRampToValueAtTime(32, now + 2.2);
                const lpf = audioCtx.createBiquadFilter();
                lpf.type = 'lowpass';
                lpf.frequency.value = 130;
                g.gain.setValueAtTime(0.001, now);
                g.gain.linearRampToValueAtTime(0.085, now + 0.22);
                g.gain.exponentialRampToValueAtTime(0.0008, now + 2.5);
                osc.connect(lpf).connect(g);
                g.connect(masterGain);
                g.connect(reverbSend);
                osc.start(now);
                osc.stop(now + 2.6);
            }

            function updateAudioSoundscape(state) {
                if (!audioCtx || isMuted) return;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => { });
                }
                const now = audioCtx.currentTime;
                const { t, wind, rain, lightning, nightLife, stoveSmoke } = state;

                // Smooth continuous environmental modulation
                windFilter.frequency.setTargetAtTime(195 + wind * 420, now, 0.25);
                windGain.gain.setTargetAtTime(0.022 + wind * 0.12, now, 0.25);
                leavesGain.gain.setTargetAtTime(0.010 + wind * 0.055, now, 0.25);
                rainGain.gain.setTargetAtTime(rain * 0.18, now, 0.3);
                tinRoofGain.gain.setTargetAtTime(rain * 0.095, now, 0.3);
                stoveCrackleGain.gain.setTargetAtTime(stoveSmoke * 0.012, now, 0.3);

                // 1. Automatic Distant Unamplified Azan at Fajr (Morning 1.2s) and Maghrib (After Rain Dusk 75.5s)
                const azanWin = (t >= 1.2 && t < 14.0) ? 1 : (t >= 75.5 && t < 87.5) ? 2 : 0;
                if (azanWin !== 0 && azanWin !== lastAutoAzanWindow) {
                    lastAutoAzanWindow = azanWin;
                    triggerUnamplifiedAzan(0.1);
                    spawnSoundRipple(468, 388, '🕌 নির্মল আজান · Distant Azan');
                } else if (azanWin === 0) {
                    lastAutoAzanWindow = 0;
                }

                // Visual gentle sound rings from distant mosque while Azan is active
                if (now < azanActiveUntil && Math.random() < 0.04) {
                    spawnSoundRipple(468, 388, '', 'rgba(255, 235, 180, 0.45)');
                }

                // 2. Morning Rooster Crow (0-14s)
                if (t < 14 && now > nextRoosterTime) {
                    triggerRoosterCrow(now);
                    nextRoosterTime = now + 6.5 + Math.random() * 5.0;
                }

                // 3. Morning & Daytime Birds (Doel & Kokil, 0-35s)
                if (t < 35 && now > nextBirdTime) {
                    triggerBirdCall(now);
                    nextBirdTime = now + 1.8 + Math.random() * 2.6;
                }

                // 4. Country Boat (Nouka) Wooden Oar Dip on River (0-42s)
                if (t < 42 && rain < 0.2 && now > nextOarTime) {
                    triggerWaterSplash(now, 0.55);
                    nextOarTime = now + 2.8 + Math.random() * 1.5;
                }

                // 5. Tea Stall Radio Bamboo Flute (Banshi) Melody in Daytime (16-34s)
                if (t > 16 && t < 34 && now > nextFluteTime) {
                    triggerTeaStallBanshi(now);
                    nextFluteTime = now + 7.5 + Math.random() * 4.0;
                }

                // 6. Distant Thunder Rumble on Nor'wester Lightning
                if (lightning > 0.5 && t - lastThunderTrigger > 4.0) {
                    triggerThunder(now);
                    lastThunderTrigger = t;
                }

                // 7. Veranda Bucket Drip Plink during Monsoon Rain
                if (rain > 0.25 && now > nextDripTime) {
                    triggerBucketDrip(now);
                    nextDripTime = now + 0.52 + Math.random() * 0.35;
                }

                // 8. Evening Crickets & Pond Frogs after Rain (73-89.5s)
                if ((nightLife > 0.15 || t > 73) && now > nextCricketTime) {
                    triggerCricketOrFrog(now, Math.random() < 0.32);
                    nextCricketTime = now + 0.24 + Math.random() * 0.42;
                }
            }

            function updateAudioButtonUI() {
                const btn = document.getElementById('audio-btn');
                const icon = document.getElementById('audio-icon');
                const label = document.getElementById('audio-label');
                if (!btn) return;
                if (isMuted) {
                    btn.classList.remove('playing');
                    icon.textContent = '🔇';
                    label.textContent = 'Muted';
                } else {
                    btn.classList.add('playing');
                    icon.textContent = '🔊';
                    label.textContent = 'Sound Active · Tap Village';
                }
            }

            function ensureAudioUnlocked() {
                if (!audioCtx) initAudioEngine();
                if (audioCtx && audioCtx.state === 'suspended' && !isMuted) {
                    audioCtx.resume().catch(() => { });
                }
            }

            function toggleAudio() {
                ensureAudioUnlocked();
                if (!audioCtx) return;
                isMuted = !isMuted;
                const now = audioCtx.currentTime;
                masterGain.gain.setTargetAtTime(isMuted ? 0.0001 : 0.90, now, 0.15);
                if (!isMuted && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => { });
                }
                updateAudioButtonUI();
            }

            function suspendAudioOnHide() {
                if (audioCtx && audioCtx.state === 'running') {
                    audioCtx.suspend();
                }
            }
            function resumeAudioOnShow() {
                if (audioCtx && !isMuted && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // Auto-initialize audio immediately on load & unlock seamlessly on any first gesture
            window.addEventListener('DOMContentLoaded', () => {
                initAudioEngine();
                updateAudioButtonUI();
                if (audioCtx && audioCtx.state === 'running') {
                    triggerUnamplifiedAzan(0.4);
                }
            });
            ['pointerdown', 'pointermove', 'touchstart', 'keydown'].forEach(evt => {
                window.addEventListener(evt, () => {
                    if (!audioCtx) {
                        initAudioEngine();
                        if (filmTime < 15 || filmTime > 74) triggerUnamplifiedAzan(0.2);
                    } else if (audioCtx.state === 'suspended' && !isMuted) {
                        audioCtx.resume().then(() => {
                            if ((filmTime < 15 || filmTime > 74) && audioCtx.currentTime > azanActiveUntil) {
                                triggerUnamplifiedAzan(0.15);
                            }
                        }).catch(() => { });
                    }
                }, { once: false, passive: true });
            });

            // Dedicated Azan Button in Top Bar
            const azanBtnEl = document.getElementById('azan-btn');
            if (azanBtnEl) {
                azanBtnEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    isMuted = false;
                    ensureAudioUnlocked();
                    updateAudioButtonUI();
                    azanActiveUntil = 0; // allow immediate re-trigger
                    triggerUnamplifiedAzan(0.05);
                    spawnSoundRipple(468, 388, '🕌 নির্মল আজান · Unamplified Village Azan');
                });
            }

            document.getElementById('audio-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleAudio();
            });

            // Interactive Canvas Click / Tap Sound Hotspots (convert screen tap to 1600x900 world coordinates)
            let currentCamTransform = { offsetX: 0, offsetY: 0, scale: 1 };
            canvas.addEventListener('pointerdown', (e) => {
                ensureAudioUnlocked();
                if (isMuted) {
                    isMuted = false;
                    if (masterGain && audioCtx) masterGain.gain.setTargetAtTime(0.90, audioCtx.currentTime, 0.12);
                    updateAudioButtonUI();
                }
                if (!audioCtx) return;

                const rect = canvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const wx = (sx - currentCamTransform.offsetX) / currentCamTransform.scale;
                const wy = (sy - currentCamTransform.offsetY) / currentCamTransform.scale;
                const now = audioCtx.currentTime;

                // Check which village element the user tapped!
                if (wy < 425 && wx > 340 && wx < 620) {
                    // Tapped the distant mosque / horizon
                    azanActiveUntil = 0;
                    triggerUnamplifiedAzan(0.02);
                    spawnSoundRipple(468, 388, '🕌 মসজিদের আজান · Distant Azan');
                } else if (Math.hypot(wx - 755, wy - 555) < 55) {
                    // Tapped the Cast-Iron Hand Tubewell (Chapakol)
                    triggerTubewellPump(now);
                    spawnSoundRipple(755, 550, '💧 চাপাকল · Hand Tubewell');
                } else if (wx > 105 && wx < 345 && wy > 435 && wy < 565) {
                    // Tapped the Tea Stall / Radio / Rickshaw
                    triggerTeaStallBanshi(now);
                    spawnSoundRipple(180, 495, '📻 চায়ের দোকানের বাঁশি · Radio Banshi');
                } else if (wy > 625 && wx > 420) {
                    // Tapped the Pond (Pukur) / Shapla / Ducks
                    triggerWaterSplash(now, 1.25);
                    ripples.push({ x: wx, y: wy, r: 2, maxR: 32, speed: 24 });
                    spawnSoundRipple(wx, wy, '🌊 পুকুরের জল · Pond Ripple');
                } else if (wx > 1250 && wy > 470 && wy < 580) {
                    // Tapped the Cow / Goat / Cattle Shed
                    triggerCowLow(now);
                    spawnSoundRipple(wx, wy, '🐄 দেশি গরু · Village Cow');
                } else if (Math.hypot(wx - 792, wy - 492) < 60) {
                    // Tapped the Rooster on the Bamboo Fence
                    triggerRoosterCrow(now);
                    spawnSoundRipple(792, 485, '🐓 মোরগের ডাক · Rooster Crow');
                } else if (wy >= 390 && wy <= 470 && wx < 850) {
                    // Tapped the River / Nouka boat
                    triggerWaterSplash(now, 1.0);
                    spawnSoundRipple(wx, wy, '⛵ নৌকার বৈঠা · Country Boat Oar');
                } else {
                    // Tapped Trees / Sky / Paddy Fields -> Melodic Doel or Kokil bird call
                    triggerBirdCall(now, wy < 320);
                    spawnSoundRipple(wx, wy, wy < 320 ? '🐦 কোকিলের ডাক · Cuckoo Call' : '🐦 দোয়েলের শিস · Doel Whistle');
                }
            });

            // ============================================================================
            // 10. UI CONTROLS, SCRUBBER, STAGE SELECTOR & IDLE FADE
            // ============================================================================
            const actLabelEl = document.getElementById('act-label');
            const timeLabelEl = document.getElementById('time-label');
            const progressFillEl = document.getElementById('progress-fill');
            const progressTrackEl = document.getElementById('progress-track');

            function formatTime(sec) {
                const s = Math.floor(sec % 90);
                const m = Math.floor(s / 60);
                const rem = s % 60;
                return `${m}:${rem < 10 ? '0' : ''}${rem}`;
            }

            function getActName(t) {
                if (t < 15) return '১ · ভোর — Morning Mist & Clay Stove (0–15s)';
                if (t < 35) return '২ · দুপুর — Schoolboy, Paddy Fields & Nouka (15–35s)';
                if (t < 55) return '৩ · কালবৈশাখী — Nor’wester Wind & Gathering Home (35–55s)';
                if (t < 75) return '৪ · বর্ষা — Monsoon Rain & Veranda Lantern (55–75s)';
                return '৫ · মেঘভাঙা সন্ধ্যা — Rainbow, Golden Hour & Fireflies (75–90s)';
            }

            function updateHUD(t) {
                actLabelEl.textContent = getActName(t);
                timeLabelEl.textContent = `${formatTime(t)} / 1:30`;
                progressFillEl.style.width = `${(t / DURATION) * 100}%`;
            }

            function scrubFromEvent(e) {
                const rect = progressTrackEl.getBoundingClientRect();
                const u = clamp((e.clientX - rect.left) / rect.width, 0, 0.999);
                filmTime = u * DURATION;
                updateHUD(filmTime);
            }

            progressTrackEl.addEventListener('pointerdown', (e) => {
                isScrubbing = true;
                progressTrackEl.setPointerCapture(e.pointerId);
                scrubFromEvent(e);
            });
            progressTrackEl.addEventListener('pointermove', (e) => {
                if (isScrubbing) scrubFromEvent(e);
            });
            progressTrackEl.addEventListener('pointerup', () => {
                isScrubbing = false;
            });

            document.querySelectorAll('.stage-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeStage = parseInt(btn.dataset.stage, 10);
                });
            });

            let idleTimer = null;
            function resetIdle() {
                document.body.classList.remove('idle');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    document.body.classList.add('idle');
                }, 3200);
            }
            window.addEventListener('pointermove', resetIdle);
            window.addEventListener('pointerdown', resetIdle);
            resetIdle();

            window.__setFilmState = (timeSec, stageNum = 4) => {
                filmTime = timeSec;
                activeStage = stageNum;
                updateHUD(filmTime);
            };

            // ============================================================================
            // 11. MAIN 60FPS ANIMATION LOOP & RESPONSIVE PORTRAIT/LANDSCAPE CAMERA
            // ============================================================================
            const sceneCanvas = createOffscreen(WORLD_W, WORLD_H);
            const sctx = sceneCanvas.getContext('2d', { alpha: false });

            function renderFrame(now) {
                requestAnimationFrame(renderFrame);
                if (isPaused) return;

                const dt = clamp((now - lastTimestamp) / 1000, 0.001, 0.1);
                lastTimestamp = now;

                if (!isScrubbing) {
                    filmTime = (filmTime + dt) % DURATION;
                }

                const state = computeWorldState(filmTime);
                updateHUD(state.t);
                updateAudioSoundscape(state);

                drawSkyAndAtmosphere(sctx, state);
                drawRiverAndPaddyFields(sctx, state);
                drawBackgroundTreesAndHomestead(sctx, state);
                drawPondAndWater(sctx, state);
                drawCharactersAndWildlife(sctx, state);
                drawWeatherAndLightOverlays(sctx, state, dt);

                // Draw interactive tubewell pump animation & sound-wave ripples in world space
                if (tubewellPumpAnim > 0.01) {
                    tubewellPumpAnim = Math.max(0, tubewellPumpAnim - dt * 2.4);
                    const pumpAng = Math.sin(tubewellPumpAnim * Math.PI * 2) * 0.45;
                    sctx.save();
                    // Gushing cool water stream from tubewell spout
                    sctx.strokeStyle = 'rgba(210, 240, 255, 0.85)';
                    sctx.lineWidth = 3.2;
                    sctx.beginPath();
                    sctx.moveTo(742, 552);
                    sctx.quadraticCurveTo(732, 562, 730, 575);
                    sctx.stroke();
                    sctx.restore();
                }
                if (soundRipples.length > 0) {
                    sctx.save();
                    for (let i = soundRipples.length - 1; i >= 0; i--) {
                        const sr = soundRipples[i];
                        sr.r += dt * 42;
                        sr.alpha = Math.max(0, 1 - sr.r / sr.maxR);
                        sctx.strokeStyle = sr.color.replace(/[0-9.]+\)$/, `${sr.alpha * 0.75})`);
                        sctx.lineWidth = 1.6;
                        sctx.beginPath();
                        sctx.arc(sr.x, sr.y, sr.r, 0, Math.PI * 2);
                        sctx.stroke();
                        if (sr.label && sr.alpha > 0.15) {
                            sctx.font = '500 12px -apple-system, BlinkMacSystemFont, "Noto Sans Bengali", sans-serif';
                            sctx.fillStyle = `rgba(255, 248, 225, ${sr.alpha})`;
                            sctx.textAlign = 'center';
                            sctx.fillText(sr.label, sr.x, sr.y - 12 - (1 - sr.alpha) * 14);
                        }
                        if (sr.r >= sr.maxR) soundRipples.splice(i, 1);
                    }
                    sctx.restore();
                }

                ctx.save();
                ctx.scale(dpr, dpr);

                const aspect = viewW / viewH;
                const worldAspect = WORLD_W / WORLD_H;

                let scale, camCenterX, camCenterY;
                if (aspect >= worldAspect) {
                    scale = Math.max(viewW / WORLD_W, viewH / WORLD_H) * (reducedMotion ? 1.0 : 1.035);
                    const halfVisW = (viewW / scale) * 0.5;
                    const halfVisH = (viewH / scale) * 0.5;
                    const targetX = WORLD_W * 0.5 + (reducedMotion ? 0 : Math.sin(state.t * 0.14) * 18);
                    camCenterX = clamp(targetX, halfVisW, WORLD_W - halfVisW);
                    camCenterY = clamp(WORLD_H * 0.5, halfVisH, WORLD_H - halfVisH);
                } else {
                    scale = (viewH / WORLD_H) * 1.02;
                    let focusX = 980;
                    if (state.t < 15) focusX = lerp(880, 960, state.t / 15);
                    else if (state.t < 35) focusX = lerp(420, 780, (state.t - 15) / 20);
                    else if (state.t < 55) focusX = lerp(980, 1180, (state.t - 35) / 20);
                    else if (state.t < 75) focusX = 1080;
                    else focusX = lerp(1040, 880, (state.t - 75) / 15);

                    const halfVisW = (viewW / scale) * 0.5;
                    const halfVisH = (viewH / scale) * 0.5;
                    camCenterX = clamp(focusX, halfVisW, WORLD_W - halfVisW);
                    camCenterY = clamp(WORLD_H * 0.51, halfVisH, WORLD_H - halfVisH);
                }

                const drawW = WORLD_W * scale;
                const drawH = WORLD_H * scale;
                const offsetX = viewW * 0.5 - camCenterX * scale;
                const offsetY = viewH * 0.5 - camCenterY * scale;

                currentCamTransform = { offsetX, offsetY, scale };
                ctx.drawImage(sceneCanvas, offsetX, offsetY, drawW, drawH);

                drawFilmFinishAndTitle(ctx, viewW, viewH, state);

                ctx.restore();
            }

            requestAnimationFrame(renderFrame);
        })();
    </script>
